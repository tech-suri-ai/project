version: '3.8'

services:
  whatsapp-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: suri-whatsapp-bot
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LANGFLOW_API_URL=${LANGFLOW_API_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - ./temp:/app/temp
      - whatsapp-sessions:/app/.wwebjs_auth
    networks:
      - bot-network
    # Configurações de recursos para economia
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('Bot is running')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  whatsapp-sessions:
    driver: local

networks:
  bot-network:
    driver: bridge 